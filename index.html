<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .score-block {
      min-width: 0;
      overflow: hidden;
    }

    #shard-total {
      display: block;
      width: 100%;
      min-height: 0.92em;
      overflow: hidden;
      font-size: clamp(1.9rem, 6.6vw, 5.45rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.065em;
      line-height: 0.9;
      text-overflow: clip;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      #shard-total {
        font-size: clamp(1.55rem, 10vw, 4.2rem);
        letter-spacing: -0.055em;
      }
    }

    @media (max-width: 560px) {
      #shard-total {
        font-size: clamp(1.25rem, 10.2vw, 3.05rem);
        letter-spacing: -0.045em;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Obsidian Winds</p>
        <h1>Obsidian Clicker</h1>
      </div>
      <details class="top-menu" id="top-menu">
        <summary>Menu</summary>
        <div class="menu-panel">
          <div class="menu-actions">
            <button id="save-btn" type="button">Save</button>
            <button id="reset-btn" type="button" class="danger">Reset</button>
          </div>
          <section class="menu-statistics" aria-labelledby="menu-statistics-heading">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">Menu</p>
                <h2 id="menu-statistics-heading">Statistics</h2>
              </div>
            </div>
            <div id="statistics-list" class="statistics-list"></div>
          </section>
        </div>
      </details>
    </header>

    <main class="game-grid">
      <section class="click-zone" aria-labelledby="shard-total">
        <div class="score-block">
          <p class="eyebrow">Current Stockpile</p>
          <h2 id="shard-total">0 Shards</h2>
          <p id="rate-summary">+1 per click · 0 per second</p>
        </div>

        <div class="logo-stage">
          <button id="logo-button" class="logo-button" type="button" aria-label="Gather Shards">
            <img id="logo-img" src="assets/obsidian-winds-logo.png" alt="Obsidian Winds logo">
            <span id="logo-fallback" class="logo-fallback" aria-hidden="true">OW</span>
          </button>
          <div id="float-layer" class="float-layer" aria-hidden="true"></div>
        </div>

        <div class="stat-strip">
          <div>
            <span id="click-power">1</span>
            <small>Click Power</small>
          </div>
          <div>
            <span id="passive-rate">0</span>
            <small>Per Second</small>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="Store and upgrades">
        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Store</p>
              <h2>Generators</h2>
            </div>
          </div>
          <div id="generator-list" class="stack-list"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Improvements</p>
              <h2>Upgrades</h2>
            </div>
          </div>
          <div id="upgrade-list" class="stack-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
